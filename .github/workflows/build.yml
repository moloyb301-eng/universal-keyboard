name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      # Every build must be signed with the same key, or Android refuses to
      # install the update over the previous version. Use the repo secret if
      # it's set, otherwise keep the key in the Actions cache.
      - name: Restore signing key from secret
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Restore signing key from cache
        if: env.DEBUG_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1.0-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: gradle assembleDebug --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/universal-keyboard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-keyboard-${{ steps.version.outputs.name }}
          path: dist/universal-keyboard.apk

      # A "nightly" release that always points at the newest main build, so
      # the APK can be downloaded on the phone from a fixed link.
      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly dist/universal-keyboard.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly build ${{ steps.version.outputs.name }}" \
            --notes "Latest build from \`main\` (${GITHUB_SHA::7}). Download **universal-keyboard.apk** below on your phone and install it."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/universal-keyboard.apk "dist/universal-keyboard-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "dist/universal-keyboard-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Universal Keyboard ${GITHUB_REF_NAME}" \
            --generate-notes
