name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Every published build must be signed with the same permanent key, or
      # Android refuses to install it as an update. Pull requests from forks
      # and Dependabot can't read secrets; they still build, but never publish.
      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::No signing key available; building with a throwaway key (not published)."
              exit 0
            fi
            echo "::error::Signing key secrets are missing; refusing to publish an APK that can't update the installed app."
            exit 1
          fi
          KS="$RUNNER_TEMP/signing.p12"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KS"
          keytool -list -storetype pkcs12 -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" | grep -i "fingerprint"
          {
            echo "SIGNING_KEYSTORE=$KS"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1.0-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: gradle assembleDebug --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}

      - name: Package APK and version info
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/universal-keyboard.apk
          # Read by the in-app updater to decide whether an update is available.
          jq -n \
            --argjson code "$GITHUB_RUN_NUMBER" \
            --arg name "$VERSION_NAME" \
            --arg sha "${GITHUB_SHA::7}" \
            --arg notes "$(git log -1 --format=%s)" \
            '{versionCode: $code, versionName: $name, sha: $sha, notes: $notes}' > dist/version.json
          cat dist/version.json

      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/universal-keyboard.apk | grep -E "SHA-256|DN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-keyboard-${{ steps.version.outputs.name }}
          path: |
            dist/universal-keyboard.apk
            dist/version.json

      # A "nightly" release that always points at the newest main build. It is
      # updated in place (never deleted) so its link and the in-app updater
      # keep working. The APK goes up before version.json, so the app never
      # sees a new version number before the matching APK is there.
      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          NOTES="Latest build from \`main\`: $(git log -1 --format=%s) (${GITHUB_SHA::7}).

          Download **universal-keyboard.apk** below on your phone and install it. Once installed, the app updates itself."
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Nightly build $VERSION_NAME" --notes "$NOTES"
          else
            gh release create nightly --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
              --title "Nightly build $VERSION_NAME" --notes "$NOTES"
          fi
          gh release upload nightly dist/universal-keyboard.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload nightly dist/version.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/universal-keyboard.apk "dist/universal-keyboard-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "dist/universal-keyboard-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Universal Keyboard ${GITHUB_REF_NAME}" \
            --generate-notes
